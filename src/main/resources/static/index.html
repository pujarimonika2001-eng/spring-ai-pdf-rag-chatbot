<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #ffd6e8 0%, #d6e4ff 50%, #e0d6ff 100%);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(110, 90, 180, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #ff7eb3, #7a6cff);
      color: #fff;
      padding: 22px 25px;
      text-align: center;
    }
    .header h2 { margin: 0; font-size: 26px; }
    .header p { margin: 6px 0 0; font-size: 14px; opacity: 0.9; }

    .upload-box {
      margin: 18px 20px 0;
      padding: 14px;
      border: 2px dashed #b9a8ff;
      background: #f7f4ff;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .upload-box input[type=file] { flex: 1; min-width: 180px; font-size: 13px; }
    .upload-box button {
      background: linear-gradient(135deg, #7a6cff, #a46bff);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .upload-box button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(122, 108, 255, 0.4);
    }
    #statusMsg { width: 100%; font-size: 14px; font-weight: 600; color: #5a4bd1; }

    #chat {
      height: 400px;
      overflow-y: auto;
      padding: 20px;
      margin: 15px 20px 0;
      background: #fafaff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: #cfc6ff; border-radius: 10px; }

    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: pop .25s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot, .msg.err { align-self: flex-start; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    .bubble { padding: 11px 15px; border-radius: 18px; line-height: 1.5; font-size: 15px; word-break: break-word; }
    .user .bubble { background: linear-gradient(135deg, #7a6cff, #a46bff); color: #fff; border-bottom-right-radius: 4px; }
    .bot .bubble { background: #fff; color: #2d2d3a; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .err .bubble { background: #ffe8ec; color: #c0264a; border-bottom-left-radius: 4px; }

    .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: #efeaff; color: #5a4bd1; font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }

    .typing span {
      display: inline-block; width: 8px; height: 8px; margin: 0 2px;
      background: #b9a8ff; border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    .input-row { display: flex; gap: 10px; padding: 18px 20px 22px; }
    #q {
      flex: 1; padding: 13px 18px; border: 2px solid #e3dcff;
      border-radius: 25px; font-size: 15px; outline: none; transition: border-color .2s;
    }
    #q:focus { border-color: #a46bff; }
    #askBtn {
      background: linear-gradient(135deg, #ff7eb3, #ff6b9d);
      color: #fff; border: none; padding: 0 26px; border-radius: 25px;
      font-weight: 700; font-size: 15px; cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    #askBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255, 107, 157, 0.45); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-7px); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h2>📄 Chat with your PDF</h2>
      <p>Upload a document and ask me anything about it ✨</p>
    </div>

    <div class="upload-box">
      <input type="file" id="file" accept="application/pdf">
      <button id="uploadBtn" onclick="upload()">Upload 🚀</button>
      <span id="statusMsg"></span>
    </div>

    <div id="chat"></div>

    <div class="input-row">
      <input id="q" placeholder="Ask a question about your PDF..."
             onkeydown="if(event.key==='Enter')ask()">
      <button id="askBtn" onclick="ask()">Ask 💬</button>
    </div>
  </div>

<script>
let docId = null;
const chat = document.getElementById('chat');
const statusMsg = document.getElementById('statusMsg');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g, '<br>');

const add = (html, cls) => {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + cls;
  const icon = cls === 'user' ? '🧑' : cls === 'err' ? '⚠️' : '🤖';
  wrap.innerHTML = `<div class="avatar">${icon}</div><div class="bubble">${html}</div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
};

add('Hi! 👋 Upload a PDF above, then ask me questions about it.', 'bot');

async function upload() {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('Choose a PDF');
  const fd = new FormData(); fd.append('file', f);
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; statusMsg.textContent = '⏳ Uploading & processing...';
  try {
    const r = await fetch('/api/upload', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    docId = d.docId;
    statusMsg.textContent = `✅ Ready (${d.chunks} chunks)`;
    add('Your PDF is ready! 🎉 Ask me anything about it.', 'bot');
  } catch (e) { statusMsg.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}

async function ask() {
  const qEl = document.getElementById('q');
  const askBtn = document.getElementById('askBtn');
  const q = qEl.value.trim();
  if (!q) return;
  if (!docId) return alert('Upload a PDF first');
  add(esc(q), 'user'); qEl.value = '';
  askBtn.disabled = true;
  const loading = add('<div class="typing"><span></span><span></span><span></span></div>', 'bot');
  try {
    const r = await fetch('/api/ask', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({docId, question:q})});
    const d = await r.json();
    loading.remove();
    if (!r.ok) throw new Error(d.error);
    const chips = d.sources.length
      ? `<div class="sources">${d.sources.map(s => `<span class="chip">📌 ${esc(s)}</span>`).join('')}</div>` : '';
    add(esc(d.answer) + chips, 'bot');
  } catch (e) { loading.remove(); add(esc(e.message), 'err'); }
  askBtn.disabled = false;
  qEl.focus();
}
</script>
</body>
</html>
