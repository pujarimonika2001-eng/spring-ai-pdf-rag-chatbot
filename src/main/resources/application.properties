spring.application.name=chatBot
server.port=8081

# Ollama (free, local)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.keep-alive=30m
spring.ai.ollama.chat.options.num-predict=200
spring.ai.ollama.chat.options.num-ctx=2048
spring.ai.ollama.embedding.options.model=nomic-embed-text

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ragdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB